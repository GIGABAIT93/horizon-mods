changelog = """
First release.

- All 150 blocks: hedges, fences, gates and walls in eleven woods and a range of stone finishes.
- Models, textures, names, 192 recipes, 150 loot tables, tags and five language files.
- Wooden fences burn in a furnace, stone sets need a pickaxe, and crafting and drops work.

Not Ported: the 11 wired fences deal no damage, that needs a native mod."""
