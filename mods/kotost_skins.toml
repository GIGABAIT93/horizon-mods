id = "kotost_skins"
kind = "resourcepack"
name = "Kotost Skins"
summary = "Replaces two of the game's default skins with Kotost Games' own."
description = """
A resource pack that swaps two of the game's **default skins** (the ones players get when they have no skin of their own): the slim *Makena* becomes the ginger **Bolvanchik**, the slim *Noor* becomes **KotostGames**.

**Heads up: this pack changes the game's standard skins**, so anyone who is shown a default Makena or Noor skin sees these instead. It does not touch skins people have chosen themselves. The source skins are in the repository."""
