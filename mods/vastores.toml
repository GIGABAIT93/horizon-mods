id = "vastores"
kind = "mod"
name = "Vast Ores"
summary = "Ten metals, three gems and nine alloys with dusts, plates, gears, rods and an ore hammer, generated in the overworld."
description = """
A content mod: data only, nothing to build.

- **Ten metals:** aluminum, lead, nickel, osmium, platinum, silver, tin, uranium, zinc and iridium. Each has a stone and a deepslate ore, raw ore, raw block, ingot, nugget, block, dust, plate, gear and rod.
- **Three gems:** ruby, sapphire and peridot, with ore, gem, block and dust.
- **Nine alloys:** bronze, brass, constantan, electrum, invar, steel, enderium, lumium and signalum. Mix their dusts in the crafting grid, then smelt the alloy dust.
- Dust, plate, gear and rod for iron, gold and copper too.
- **Ore hammer** (two iron ingots, two sticks): hammer + raw ore = two dusts, hammer + ingot = a plate. It isn't used up.
- Ores generate in the overworld, with a second, richer layer below y 0 for players who dig deep. Only new chunks get them.
- `c:` convention tags (`c:ingots/tin`, `c:dusts/bronze`...) so other mods' recipes can use them.

Every texture is drawn by code in the repository. Inspired by AllTheOres by the All The Mods team; a clean-room work with no code, data or art from it, not affiliated with or endorsed by All The Mods."""
