changelog = """
Follows the 2026-11-10 Nightly's client reorganisation; no player-visible behavior change.

Horizon moved Game::apply_mouse_look out of game.rs into the new game/pointer_capture module. The mouse hook now targets game::pointer_capture::Game<'_>::apply_mouse_look, which is why 1.4.1 failed to build there (E_TARGET_NOT_FOUND).
Horizon also split the reusable horizon-client-lib crate out of the client, and mobs::render — where the avatar-lock hook sits — is now compiled from it. The gyro support module is therefore declared in crates/horizon-client/src/client_lib.rs instead of lib.rs, so both crates can reach it (both alias themselves as horizon_client).
The turn hook now matches vanilla's pointer-grab condition, including Horizon Studio's flying camera.
The bundle pins horizon-mixins e59da90: the older d9c83d70 refuses any support module in the client crate root because lib.rs gained a pub use horizon_client_lib::*; glob it cannot resolve (E_MODULE_CONFLICT); newer horizon-mixins resolves the glob properly.
The in-game proof harness now records whether the player is still gliding at each step, which is what caught the landing-timing flake during this verification."""

