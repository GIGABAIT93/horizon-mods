id = "capipimon"
kind = "mod"
name = "Capipimon Content"
summary = "Textures and creature data for Capipimon. Needs the Capipimon listing too."
description = """
**Install both listings in the same instance:** Capipimon (the game code) and Capipimon Content (this one, textures and creature data). This listing does nothing on its own.

It holds Capipimon's entity types, textures, language files and licence texts. Install, playing and server notes are on the Capipimon listing.

The models, animations and textures come from Cobblemon and many community add-on packs, and each keeps its own licence. See CREDITS.md in the source for every author, licence and link. The icon shows Cobblemon's Buneary model and shiny texture (CC BY-NC 3.0) wearing Capipimon's original Bow hat.

Talent NPCs on Capipimon servers wear skins of Minecraft accounts chosen by the server, loaded from Mojang's skin servers.

Unofficial fan project, not affiliated with or endorsed by Nintendo, The Pokémon Company, Game Freak or Phase Connect. Pokémon and all related names are trademarks of their respective owners."""
