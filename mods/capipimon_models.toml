name = "Capipimon"
summary = "Become a Pokémon and fight other players on a Capipimon server. Fan-made PvP. Needs Capipimon Content too."
description = """
**Install both listings in the same instance:** Capipimon (this one, the game code) and Capipimon Content (textures and creature data). Neither works alone.

Capipimon is a free, fan-made PvP mod. You play as a Capipimon and fight other players with move kits, guarding and dodging. It draws its creatures from community Cobblemon-format models.

### Before you install
- This is a native mod, so it compiles on your PC. The first build usually takes 10 to 30 minutes.
- Native mods run with the same access to your computer as the game.
- It needs Minecraft 26.3.
- This is the client: it only does something on a Capipimon server. Single player and LAN worlds stay vanilla, and the server itself isn't public. Get the address from whoever runs a Capipimon server.
- Keep both listings on the same version and up to date. A server refuses players whose content doesn't match its own, and tells players with an old Capipimon to update.

### Credits and licences
Capipimon's client code is GPL-3.0-only. The models, animations and textures come from Cobblemon and many community add-on packs, and each keeps its own licence. See CREDITS.md in the source for every author, licence and link. The icon shows Cobblemon's Buneary model and shiny texture (CC BY-NC 3.0) wearing Capipimon's original Bow hat.

Talent NPCs on Capipimon servers wear skins of Minecraft accounts chosen by the server, loaded from Mojang's skin servers.

### Disclaimer
Unofficial fan project, not affiliated with or endorsed by Nintendo, The Pokémon Company, Game Freak or Phase Connect. Pokémon and all related names are trademarks of their respective owners."""
