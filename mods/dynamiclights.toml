id = "dynamiclights"
kind = "native-mod"
name = "Better Dynamic Lights"
summary = "Horizon's built-in dynamic lights, with more: glowing creatures, projectiles and TNT shine too, water puts out fire, a switch for every light."
description = """
**Horizon's dynamic lights, taken further.** Horizon already has built-in dynamic lights (Options > Horizon Extras > Dynamic lights, off by default): items in your hands, dropped items and burning mobs light up the world, with one on/off switch. Better Dynamic Lights uses the same light renderer and takes the place of that switch while it is on, with much more.

| | Built into Horizon | Better Dynamic Lights |
|---|---|---|
| Held items (yours, other players', mobs') and dropped items | ✅ | ✅ + armor stands |
| Burning mobs and items | ✅ | ✅ + burning arrows and tridents |
| Glowing creatures: blazes, magma cubes, glow squids, allays, vexes | — | ✅ |
| Projectiles: fireballs, wither skulls, shulker bullets, spectral arrows, firework rockets | — | ✅ |
| Primed TNT, TNT and furnace minecarts | — | ✅ |
| Water puts out fire (lanterns keep shining) | — | ✅ |
| A switch for every kind of light | — | ✅ |
| Brightness, range and number of lights | — | ✅ |
| A key to turn the lights on and off | — | ✅ |
| Its own settings screen, Mod Menu, English and Russian | — | ✅ |
| On by default | off | on |

An item glows as brightly as its block does when placed (torch 14, lantern and glowstone 15, soul torch 10…). Turn the mod off in Options > Mods and Horizon's own switch works as before. Client side: it changes only what you see, on any server.

Built for Horizon Nightly 2026-11-08 (`fdc87ae`). Native mods are compiled into the game and are not sandboxed: build only code you trust.

**Credits.** An original mod for Horizon by DeportedToHell, MIT License, written from scratch. Not affiliated with Mojang or Microsoft. Found a bug? [Report it here](https://github.com/DeportedToHell/MCRE-Mods/issues)."""
